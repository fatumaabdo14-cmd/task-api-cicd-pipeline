name: CFN Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  validate-cfn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID2026 }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY2026 }}
          aws-region: us-west-1

      - name: Deploy Test Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/lambda.yml \
            --stack-name pr-test-stack-${{ github.event.pull_request.number }} \
            --capabilities CAPABILITY_IAM

      - name: Comment PR
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'CloudFormation test stack deployed. Stack name: pr-test-stack-${{ github.event.pull_request.number }}'
            })

  cleanup-on-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    needs: validate-cfn
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID2026 }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY2026 }}
          aws-region: us-west-1

      - name: Delete Test Stack
        run: |
          aws cloudformation delete-stack --stack-name pr-test-stack-${{ github.event.pull_request.number }}