AWSTemplateFormatVersion: '2010-09-09'
Description: 'Task API Lambda function'

Resources:
  TaskLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess

  TaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "task-api-function-${AWS::StackName}"
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt TaskLambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          def lambda_handler(event, context):
              table.put_item(Item={"id": "1", "title": "Learn CloudFormation"})
              table.put_item(Item={"id": "2", "title": "Build a CI/CD pipeline"})
              response = table.scan()
              tasks = response.get('Items', [])
              return {
                  "statusCode": 200,
                  "body": json.dumps({"tasks": tasks})
              }

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "tasks-table-${AWS::StackName}"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  FunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt TaskFunction.Arn

  TasksTableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt TasksTable.Arn